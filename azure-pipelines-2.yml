trigger: none

pr: none

pool:
  vmImage: "ubuntu-latest"

steps:

  - checkout: self
    fetchDepth: 0
    persistCredentials: false

  - bash: |
      set -e

      echo "Configuring Git..."

      git config user.name "Azure DevOps"
      git config user.email "azuredevops@localhost"

      echo "Adding GitHub remote..."

      git remote add github \
        "https://${GITHUB_USERNAME}:${GITHUB_PAT}@github.com/kwongheng/JDE10_final_project.git"

      echo "Pushing ALL files/current repository state to GitHub..."

      git push github --mirror --force

      echo "GitHub repository updated successfully."

    displayName: "Push entire repository to GitHub"

    env:
      GITHUB_USERNAME: $(GITHUB_USERNAME)
      GITHUB_PAT: $(GITHUB_PAT)