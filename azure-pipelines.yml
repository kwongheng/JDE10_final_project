trigger: none

pr: none

schedules:
  - cron: "0 0,12 * * *"
    displayName: "Sync to GitHub every 12 hours"
    branches:
      include:
        - main
    always: true

pool:
  vmImage: "ubuntu-latest"

steps:

  - checkout: self
    fetchDepth: 0
    persistCredentials: false

  - script: |
      git config user.name "Azure DevOps"
      git config user.email "azuredevops@localhost"

      git remote add github https://$(GITHUB_USERNAME):$(GITHUB_PAT)@github.com/kwongheng/JDE10_final_project.git

      git push github HEAD:main --force
    displayName: "Force push Azure DevOps repository to GitHub"
    env:
      GITHUB_USERNAME: $(GITHUB_USERNAME)
      GITHUB_PAT: $(GITHUB_PAT)