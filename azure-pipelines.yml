trigger:
  - main  # Adjust branch trigger as needed

# Link your Variable Group containing GITHUB_PAT
variables:
  - group: github-credentials

pool:
  vmImage: 'ubuntu-latest'

steps:
  # Step 1: Checkout repository
  - checkout: self
    persistCredentials: true

  # Step 2: Perform file/content modifications
  - script: |
      echo "Automated update from Azure DevOps Pipeline: $(Build.BuildNumber)" >> update-log.txt
    displayName: 'Modify/Generate files'

  # Step 3: Configure Git & Push to GitHub using secret PAT
  - script: |
      # Configure Git identity
      git config --global user.email "azure-pipeline@dev.azure.com"
      git config --global user.name "Azure DevOps Pipeline"

      # Stage changes
      git add .
      
      # Commit if there are changes
      git diff-index --quiet HEAD || git commit -m "Automated push from Azure DevOps [Build $(Build.BuildNumber)]"

      # Push changes back to GitHub using the Secret PAT
      # Format: https://<PAT>@github.com/<owner>/<repo>.git
      git push https://$(GITHUB_PAT)@github.com/kwongheng/JDE10_final_project.git HEAD:main
    displayName: 'Commit and Push to GitHub'