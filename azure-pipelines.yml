trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: github-credentials

steps:
- checkout: self
  fetchDepth: 0

- bash: |
    set -e

    git remote remove github 2>/dev/null || true

    git remote add github \
      https://x-access-token:$(GITHUB_PAT)@github.com/kwongheng/JDE10_final_project.git

    echo "Azure DevOps HEAD:"
    git rev-parse HEAD

    echo "Pushing current commit to GitHub main..."

    git push github HEAD:refs/heads/main --force

    echo "GitHub sync complete"
  displayName: 'Sync Azure DevOps Repo to GitHub'